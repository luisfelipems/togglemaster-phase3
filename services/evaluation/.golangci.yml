# .golangci.yml — configuracao do linter para o evaluation-service
# Mantemos checagens de segurança (gosec, govet) e desabilitamos
# regras de estilo que nao impactam segurança.

run:
  timeout: 5m
  go: '1.21'

linters:
  # Desabilitar apenas linters de estilo que nao sao relevantes para segurança
  disable:
    - errcheck      # retornos de erro nao verificados — estilo, nao vulnerabilidade
  
  # Os linters abaixo ficam ATIVOS (padrão golangci-lint):
  # govet, gosimple, ineffassign, unused, typecheck, gosec, staticcheck

issues:
  exclude-rules:
    # io/ioutil foi deprecated no Go 1.16 mas ainda funciona corretamente.
    # Nao e uma vulnerabilidade de seguranca (SA1019 = aviso de deprecacao).
    - linters:
        - staticcheck
      text: "SA1019"
  
  # Garantir que o max de issues nao oculte erros de segurança
  max-issues-per-linter: 0
  max-same-issues: 0
