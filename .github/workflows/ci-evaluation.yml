name: CI - Evaluation Service

on:
  push:
    branches: [main]
    paths:
      - 'services/evaluation/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/evaluation/**'

env:
  SERVICE: evaluation
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  IMAGE_TAG: v1.0.0-${{ github.sha }}

jobs:
  build-and-test:
    name: Build e Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencias
        working-directory: services/evaluation
        run: go mod download

      - name: Build
        working-directory: services/evaluation
        run: go build -v ./...

      - name: Testes unitarios
        working-directory: services/evaluation
        run: go test -v ./...

  lint:
    name: Linter e Analise Estatica
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: services/evaluation

  security-scan:
    name: Security Scan (SAST)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Instalar gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: SAST - gosec
        working-directory: services/evaluation
        run: $(go env GOPATH)/bin/gosec ./...
