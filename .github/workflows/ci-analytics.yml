name: CI Analytics Service

on:
  push:
    paths:
      - 'services/analytics/**'

jobs:
  build-and-test:
    name: Build e Testes (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar dependências
        working-directory: services/analytics
        run: pip install -r requirements.txt
      - name: Rodar testes
        working-directory: services/analytics
        run: python -m pytest tests/ -v --cov=. --cov-report=xml

  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar ferramentas de lint
        run: pip install flake8 pylint
      - name: flake8 (estilo)
        working-directory: services/analytics
        run: flake8 . --max-line-length=120 --exclude=.venv
      - name: pylint (análise estática)
        working-directory: services/analytics
        run: pylint . --fail-under=7.0

  security-scan:
    name: Security Scan (Python)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar pip-audit
        run: pip install pip-audit