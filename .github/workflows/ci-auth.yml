name: CI - Auth Service

on:
  push:
    branches: [main]
    paths:
      - 'services/auth/**'
      - '.github/workflows/ci-auth.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/auth/**'

env:
  SERVICE: auth
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  IMAGE_TAG: v1.0.0-${{ github.sha }}

jobs:
  # ============================================================
  # JOB 1: Build e Testes Unitários
  # ============================================================
  build-and-test:
    name: Build e Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'   # CVE-2025-68121: stdlib fix em 1.25.7
          cache: true

      - name: Gerar go.sum e baixar deps
        working-directory: services/auth
        run: |
          # go mod edit garante que go.mod nao suba para 1.25 (incompativel com golangci-lint)
          go mod edit -go=1.21
          go mod tidy
          go mod download

      - name: Build
        working-directory: services/auth
        run: go build -v ./...

      - name: Testes unitarios
        working-directory: services/auth
        run: go test -v ./...

  # ============================================================
  # JOB 2: Lint
  # ============================================================
  lint:
    name: Linter e Analise Estatica
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      # GOTOOLCHAIN=local impede que golangci-lint ou go ativem Go 1.25
      # mesmo que go.mod declare "go 1.25"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      # golangci-lint v1.64.8 compilado com Go 1.24 nao suporta "go 1.25" no go.mod.
      # Usamos Go 1.22 + GOTOOLCHAIN=local + sed para garantir que go.mod diga 1.21.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Rebaixar go.mod e compilar deps para linter
        working-directory: services/auth
        run: |
          # sed edita o arquivo diretamente, independente do toolchain
          sed -i 's/^go [0-9][0-9.]*/go 1.21/' go.mod
          sed -i '/^toolchain/d' go.mod
          echo "=== go.mod apos edicao ==="
          cat go.mod
          # go mod download baixa o source; go build cria o export data (.a)
          # que o golangci-lint precisa para "could not load export data"
          go mod download
          go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: services/auth
          skip-cache: true

  # ============================================================
  # JOB 3: Security Scan — SCA + SAST (gate de segurança)
  # ============================================================
  security-scan:
    name: Security Scan (SCA + SAST)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'   # CVE-2025-68121: consistente com o builder do Dockerfile

      - name: Baixar deps
        working-directory: services/auth
        run: |
          go mod edit -go=1.21
          go mod download

      # SCA: vulnerabilidades nas dependências
      - name: SCA - Trivy (dependencias)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'services/auth'
          severity: 'CRITICAL'
          exit-code: '1'   # pipeline falha se achar vulnerabilidade CRÍTICA

      # SAST: vulnerabilidades no código fonte
      - name: Instalar gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: SAST - gosec
        working-directory: services/auth
        run: $(go env GOPATH)/bin/gosec -severity high ./...

  # ============================================================
  # JOB 4: Docker Build + Container Scan + Push ECR
  # ============================================================
  docker-build-push:
    name: Docker Build, Scan e Push ECR
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build da imagem Docker
        run: |
          docker build -t $ECR_REGISTRY/togglemaster/$SERVICE:$IMAGE_TAG \
            services/$SERVICE/

      # Container Scan: scan da imagem antes de enviar
      - name: Container Scan - Trivy (imagem)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_REGISTRY }}/togglemaster/${{ env.SERVICE }}:${{ env.IMAGE_TAG }}'
          severity: 'CRITICAL'
          exit-code: '1'   # bloqueia push se imagem tiver crítico

      - name: Push para o ECR
        run: |
          docker push $ECR_REGISTRY/togglemaster/$SERVICE:$IMAGE_TAG

  # ============================================================
  # JOB 5: Atualizar tag no repositório GitOps
  # ============================================================
  update-gitops:
    name: Update GitOps
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repositorio GitOps
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/togglemaster-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Atualizar tag da imagem no deployment.yaml
        run: |
          NEW_IMAGE="${ECR_REGISTRY}/togglemaster/${SERVICE}:${IMAGE_TAG}"
          sed -i "s|image: .*togglemaster/${SERVICE}.*|image: ${NEW_IMAGE}|g" \
            gitops/apps/${SERVICE}/deployment.yaml
          cat gitops/apps/${SERVICE}/deployment.yaml | grep image:

      - name: Commit e Push no GitOps
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/${SERVICE}/deployment.yaml
          git diff --staged --quiet || git commit -m \
            "chore: update ${SERVICE} image to ${IMAGE_TAG} [skip ci]"
          git push
